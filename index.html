<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formula Builder</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f11;
    --surface: #18181d;
    --border: #2a2a33;
    --accent: #e8ff47;
    --accent2: #47c8ff;
    --danger: #ff5c5c;
    --text: #f0f0f0;
    --muted: #666680;
    --op-add: #6bffb8;
    --op-sub: #ff7e7e;
    --op-mul: #ffc96b;
    --op-div: #b47eff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    min-height: 100vh;
    padding: 2rem 1rem 4rem;
  }

  header {
    max-width: 820px;
    margin: 0 auto 3rem;
  }

  header h1 {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: clamp(2rem, 5vw, 3.2rem);
    letter-spacing: -0.03em;
    line-height: 1;
    color: var(--accent);
  }

  header p {
    margin-top: 0.6rem;
    font-size: 0.8rem;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  .container {
    max-width: 820px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }

  /* Step list */
  #steps-list {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }

  .step-row {
    display: grid;
    grid-template-columns: 38px 110px 1fr 1fr auto;
    gap: 0.5rem;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.7rem 0.9rem;
    animation: fadeIn 0.18s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .step-index {
    font-size: 0.7rem;
    color: var(--muted);
    text-align: center;
    font-weight: 600;
  }

  select, input[type="text"], input[type="number"] {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.82rem;
    padding: 0.45rem 0.6rem;
    width: 100%;
    outline: none;
    transition: border-color 0.15s;
  }

  select:focus, input:focus {
    border-color: var(--accent);
  }

  select {
    cursor: pointer;
  }

  .op-select option { background: #1a1a22; }

  /* colour the select border by operation */
  .step-row[data-op="+"] select.op-select { border-color: var(--op-add); color: var(--op-add); }
  .step-row[data-op="-"] select.op-select { border-color: var(--op-sub); color: var(--op-sub); }
  .step-row[data-op="*"] select.op-select { border-color: var(--op-mul); color: var(--op-mul); }
  .step-row[data-op="/"] select.op-select { border-color: var(--op-div); color: var(--op-div); }

  .btn-remove {
    background: none;
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--muted);
    cursor: pointer;
    font-size: 1rem;
    padding: 0.35rem 0.55rem;
    line-height: 1;
    transition: border-color 0.15s, color 0.15s;
  }
  .btn-remove:hover { border-color: var(--danger); color: var(--danger); }

  /* Controls bar */
  .controls {
    display: flex;
    gap: 0.7rem;
    flex-wrap: wrap;
    align-items: center;
  }

  .btn {
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    font-size: 0.82rem;
    letter-spacing: 0.05em;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    padding: 0.55rem 1.1rem;
    transition: opacity 0.15s, transform 0.1s;
  }
  .btn:hover { opacity: 0.85; }
  .btn:active { transform: scale(0.97); }

  .btn-primary { background: var(--accent); color: #0f0f11; }
  .btn-calc    { background: var(--accent2); color: #0f0f11; }
  .btn-clear   { background: var(--surface); color: var(--muted); border: 1px solid var(--border); }

  /* Starting value */
  .start-row {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.75rem 1rem;
  }
  .start-row label {
    font-size: 0.75rem;
    color: var(--muted);
    white-space: nowrap;
    letter-spacing: 0.05em;
  }
  .start-row input {
    max-width: 160px;
  }

  /* Result panel */
  #result-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.2rem 1.4rem;
    display: none;
  }
  #result-panel.visible { display: block; animation: fadeIn 0.2s ease; }

  #result-panel h2 {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 1rem;
  }

  .trace {
    display: flex;
    flex-direction: column;
    gap: 0.45rem;
    margin-bottom: 1.2rem;
  }

  .trace-line {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    font-size: 0.8rem;
  }

  .trace-op {
    display: inline-block;
    width: 22px;
    text-align: center;
    font-weight: 600;
    flex-shrink: 0;
  }
  .trace-op.add { color: var(--op-add); }
  .trace-op.sub { color: var(--op-sub); }
  .trace-op.mul { color: var(--op-mul); }
  .trace-op.div { color: var(--op-div); }

  .trace-desc { color: var(--muted); }
  .trace-val  { color: var(--text); font-weight: 500; }
  .trace-running { margin-left: auto; color: var(--muted); font-size: 0.72rem; }

  .final-answer {
    border-top: 1px solid var(--border);
    padding-top: 1rem;
    display: flex;
    align-items: baseline;
    gap: 1rem;
  }
  .final-label {
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .final-number {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 2.4rem;
    color: var(--accent);
    letter-spacing: -0.03em;
  }

  .empty-hint {
    text-align: center;
    color: var(--muted);
    font-size: 0.75rem;
    padding: 1.5rem 0;
    letter-spacing: 0.04em;
  }

  @media (max-width: 560px) {
    .step-row {
      grid-template-columns: 28px 90px 1fr 1fr auto;
      gap: 0.35rem;
      padding: 0.6rem 0.6rem;
    }
    input, select { font-size: 0.75rem; }
  }
</style>
</head>
<body>

<header>
  <h1>Formula Builder</h1>
  <p>// build a chain of operations → see the result step by step</p>
</header>

<div class="container">

  <!-- Starting value -->
  <div class="start-row">
    <label>START WITH</label>
    <input type="number" id="start-value" value="0" step="any" placeholder="0">
  </div>

  <!-- Steps -->
  <div id="steps-list">
    <div class="empty-hint" id="empty-hint">No steps yet — add one below.</div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="btn btn-primary" onclick="addStep()">+ Add Step</button>
    <button class="btn btn-calc" onclick="calculate()">▶ Calculate</button>
    <button class="btn btn-clear" onclick="clearAll()">✕ Clear All</button>
  </div>

  <!-- Result -->
  <div id="result-panel">
    <h2>Calculation Trace</h2>
    <div class="trace" id="trace"></div>
    <div class="final-answer">
      <span class="final-label">Result</span>
      <span class="final-number" id="final-number">—</span>
    </div>
  </div>

</div>

<script>
  let stepCount = 0;

  const OP_LABELS = {
    '+': { word: 'Added',        cls: 'add' },
    '-': { word: 'Subtracted',   cls: 'sub' },
    '*': { word: 'Multiplied by',cls: 'mul' },
    '/': { word: 'Divided by',   cls: 'div' },
  };

  function addStep() {
    stepCount++;
    document.getElementById('empty-hint')?.remove();

    const list = document.getElementById('steps-list');
    const row = document.createElement('div');
    row.className = 'step-row';
    row.dataset.op = '+';
    row.dataset.id = stepCount;

    row.innerHTML = `
      <span class="step-index">#${list.children.length + 1}</span>
      <select class="op-select" onchange="this.closest('.step-row').dataset.op=this.value; reindex()">
        <option value="+">＋ add</option>
        <option value="-">－ subtract</option>
        <option value="*">× multiply</option>
        <option value="/">÷ divide</option>
      </select>
      <input type="number" class="val-input" placeholder="amount" value="1" step="any">
      <input type="text"   class="name-input" placeholder="variable name">
      <button class="btn-remove" onclick="removeStep(this)" title="Remove">✕</button>
    `;

    list.appendChild(row);
    reindex();
    row.querySelector('.name-input').focus();
  }

  function removeStep(btn) {
    btn.closest('.step-row').remove();
    reindex();
    if (!document.querySelectorAll('.step-row').length) {
      const hint = document.createElement('div');
      hint.className = 'empty-hint';
      hint.id = 'empty-hint';
      hint.textContent = 'No steps yet — add one below.';
      document.getElementById('steps-list').appendChild(hint);
    }
  }

  function reindex() {
    document.querySelectorAll('.step-row .step-index').forEach((el, i) => {
      el.textContent = `#${i + 1}`;
    });
  }

  function fmt(n) {
    // nice number formatting
    if (!isFinite(n)) return n.toString();
    const s = parseFloat(n.toPrecision(10)).toString();
    return s;
  }

  function calculate() {
    const startVal = parseFloat(document.getElementById('start-value').value) || 0;
    const rows = document.querySelectorAll('.step-row');

    const panel = document.getElementById('result-panel');
    const trace = document.getElementById('trace');
    trace.innerHTML = '';

    let running = startVal;

    // First line: starting value
    const startLine = document.createElement('div');
    startLine.className = 'trace-line';
    startLine.innerHTML = `
      <span class="trace-op" style="color:var(--muted)">=</span>
      <span class="trace-desc">Starting value</span>
      <span class="trace-val">${fmt(startVal)}</span>
    `;
    trace.appendChild(startLine);

    rows.forEach(row => {
      const op   = row.dataset.op;
      const val  = parseFloat(row.querySelector('.val-input').value);
      const name = row.querySelector('.name-input').value.trim() || `value`;

      if (isNaN(val)) return;

      let prev = running;
      if      (op === '+') running += val;
      else if (op === '-') running -= val;
      else if (op === '*') running *= val;
      else if (op === '/') running = val !== 0 ? running / val : NaN;

      const meta = OP_LABELS[op];
      const line = document.createElement('div');
      line.className = 'trace-line';
      line.innerHTML = `
        <span class="trace-op ${meta.cls}">${op}</span>
        <span class="trace-desc">${meta.word} <strong>${name}</strong></span>
        <span class="trace-val">${fmt(val)}</span>
        <span class="trace-running">→ ${isFinite(running) ? fmt(running) : '∞ / undefined'}</span>
      `;
      trace.appendChild(line);
    });

    document.getElementById('final-number').textContent =
      isFinite(running) ? fmt(running) : (isNaN(running) ? 'undefined (÷0)' : '∞');

    panel.classList.add('visible');
    panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function clearAll() {
    document.getElementById('steps-list').innerHTML =
      `<div class="empty-hint" id="empty-hint">No steps yet — add one below.</div>`;
    document.getElementById('result-panel').classList.remove('visible');
    document.getElementById('start-value').value = '0';
    stepCount = 0;
  }
</script>
</body>
</html>
