<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formula Builder</title>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Roboto:wght@400;600;800&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #fff6fb;
  --surface: #ffffff;
  --border: #efd6e6;

  --accent: #d94f8a;
  --accent2: #f07cab;

  --danger: #d85c7a;

  --text: #1d1118;
  --muted: #8b7481;

  --op-add: #e05297;
  --op-sub: #d96b6b;
  --op-mul: #56ada7;
  --op-div: #9b59b6;

  --font-body: 'IBM Plex Mono', monospace;
  --font-heading: 'Roboto', sans-serif;
  --font-ui: 'Roboto', sans-serif;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  min-height: 100vh;
  padding: 2rem 1rem 4rem;
}

header {
  max-width: 820px;
  margin: 0 auto 3rem;
}

header h1 {
  font-family: var(--font-ui);
  font-weight: 800;
  font-size: clamp(2rem, 5vw, 3.2rem);
  letter-spacing: -0.03em;
  line-height: 1;
  color: var(--accent);
}

header p {
  margin-top: 0.6rem;
  font-size: 0.8rem;
  color: var(--muted);
  letter-spacing: 0.05em;
}

.container {
  max-width: 820px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
}

#steps-list {
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
}

.step-row {
  display: grid;
  grid-template-columns: 38px 130px 1fr 1fr auto;
  gap: 0.5rem;
  align-items: center;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.7rem 0.9rem;
  animation: fadeIn 0.18s ease;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(-6px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.step-index {
  font-size: 0.7rem;
  color: var(--muted);
  text-align: center;
  font-weight: 600;
}

select,
input[type="text"] {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 5px;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 0.82rem;
  padding: 0.45rem 0.6rem;
  width: 100%;
  outline: none;
  transition: border-color 0.15s;
}

select:focus,
input:focus {
  border-color: var(--accent);
}

select {
  cursor: pointer;
}

.step-row[data-op="+"] select.op-select {
  border-color: var(--op-add);
  color: var(--op-add);
}

.step-row[data-op="-"] select.op-select {
  border-color: var(--op-sub);
  color: var(--op-sub);
}

.step-row[data-op="*"] select.op-select {
  border-color: var(--op-mul);
  color: var(--op-mul);
}

.step-row[data-op="/"] select.op-select {
  border-color: var(--op-div);
  color: var(--op-div);
}

.btn-remove {
  background: none;
  border: 1px solid var(--border);
  border-radius: 5px;
  color: var(--muted);
  cursor: pointer;
  font-size: 1rem;
  padding: 0.35rem 0.55rem;
  line-height: 1;
  transition: border-color 0.15s, color 0.15s;
}

.btn-remove:hover {
  border-color: var(--danger);
  color: var(--danger);
}

.controls {
  display: flex;
  gap: 0.7rem;
  flex-wrap: wrap;
  align-items: center;
}

.btn {
  font-family: var(--font-ui);
  font-weight: 600;
  font-size: 0.82rem;
  letter-spacing: 0.05em;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  padding: 0.55rem 1.1rem;
  transition: opacity 0.15s, transform 0.1s;
}

.btn:hover {
  opacity: 0.85;
}

.btn:active {
  transform: scale(0.97);
}

.btn-primary {
  background: var(--accent);
  color: #0f0f11;
}

.btn-calc {
  background: var(--accent2);
  color: #0f0f11;
}

.btn-clear {
  background: var(--surface);
  color: var(--muted);
  border: 1px solid var(--border);
}

.start-row {
  display: flex;
  align-items: center;
  gap: 0.8rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.75rem 1rem;
}

.start-row label {
  font-size: 0.75rem;
  color: var(--muted);
  white-space: nowrap;
  letter-spacing: 0.05em;
}

.start-row input {
  max-width: 160px;
}

#result-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 1.2rem 1.4rem;
  display: none;
}

#result-panel.visible {
  display: block;
  animation: fadeIn 0.2s ease;
}

#result-panel h2 {
  font-family: var(--font-heading);
  font-weight: 800;
  font-size: 0.7rem;
  letter-spacing: 0.12em;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 1rem;
}

.trace {
  display: flex;
  flex-direction: column;
  gap: 0.45rem;
  margin-bottom: 1.2rem;
}

.trace-line {
  display: flex;
  align-items: center;
  gap: 0.7rem;
  font-size: 0.8rem;
}

.trace-op {
  display: inline-block;
  width: 22px;
  text-align: center;
  font-weight: 600;
  flex-shrink: 0;
}

.trace-op.add { color: var(--op-add); }
.trace-op.sub { color: var(--op-sub); }
.trace-op.mul { color: var(--op-mul); }
.trace-op.div { color: var(--op-div); }

.trace-desc {
  color: var(--muted);
}

.trace-val {
  color: var(--text);
  font-weight: 500;
}

.trace-running {
  margin-left: auto;
  color: var(--muted);
  font-size: 0.72rem;
}

.final-answer {
  border-top: 1px solid var(--border);
  padding-top: 1rem;
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
}

.final-main {
  display: flex;
  align-items: baseline;
  gap: 1rem;
}

.final-label {
  font-size: 0.7rem;
  letter-spacing: 0.1em;
  color: var(--muted);
  text-transform: uppercase;
}

.final-number {
  font-family: var(--font-heading);
  font-weight: 800;
  font-size: 2.4rem;
  color: var(--accent);
  letter-spacing: -0.03em;
}

.final-raw {
  color: var(--muted);
  font-size: 0.8rem;
}

.empty-hint {
  text-align: center;
  color: var(--muted);
  font-size: 0.75rem;
  padding: 1.5rem 0;
  letter-spacing: 0.04em;
}

@media (max-width: 560px) {
  .step-row {
    grid-template-columns: 28px 90px 1fr 1fr auto;
    gap: 0.35rem;
    padding: 0.6rem;
  }

  input,
  select {
    font-size: 0.75rem;
  }
}
</style>
</head>

<body>

<header>
  <h1>Formula Builder</h1>
  <p>// build a chain of operations → see the result step by step</p>
</header>

<div class="container">

  <div class="start-row">
    <label>START WITH</label>
    <input type="text" id="start-value" value="0" placeholder="0">
  </div>

  <div id="steps-list">
    <div class="empty-hint" id="empty-hint">
      No steps yet — add one below.
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-primary" onclick="addStep()">+ Add Step</button>
    <button class="btn btn-calc" onclick="calculate()">▶ Calculate</button>
    <button class="btn btn-clear" onclick="clearAll()">✕ Clear All</button>
  </div>

  <div id="result-panel">
    <h2>Calculation Trace</h2>

    <div class="trace" id="trace"></div>

    <div class="final-answer">

      <div class="final-main">
        <span class="final-label">Result</span>
        <span class="final-number" id="final-number">—</span>
      </div>

      <div class="final-raw" id="final-raw"></div>

    </div>
  </div>

</div>

<script>
let stepCount = 0;

const OP_LABELS = {
  '+': { word: 'Added', cls: 'add' },
  '-': { word: 'Subtracted', cls: 'sub' },
  '*': { word: 'Multiplied by', cls: 'mul' },
  '/': { word: 'Divided by', cls: 'div' },
};

const SUFFIXES = {
  m: 1e6,
  b: 1e9,
  t: 1e12
};

function parseSuffix(raw) {
  if (!raw) return NaN;

  const s = String(raw).replace(/,/g, '').trim();

  const match = s.match(/^(-?\d+(\.\d+)?)\s*([mMbBtT]?)$/);

  if (!match) return NaN;

  const num = parseFloat(match[1]);
  const suffix = match[3].toLowerCase();

  if (suffix && SUFFIXES[suffix]) {
    return num * SUFFIXES[suffix];
  }

  return num;
}

function fmtCompact(n) {
  if (!isFinite(n)) return String(n);

  const abs = Math.abs(n);
  const sign = n < 0 ? '-' : '';

  if (abs >= 1e12) {
    return sign + (abs / 1e12).toLocaleString('en-GB', {
      maximumFractionDigits: 3
    }) + 'T';
  }

  if (abs >= 1e9) {
    return sign + (abs / 1e9).toLocaleString('en-GB', {
      maximumFractionDigits: 3
    }) + 'B';
  }

  if (abs >= 1e6) {
    return sign + (abs / 1e6).toLocaleString('en-GB', {
      maximumFractionDigits: 3
    }) + 'M';
  }

  return n.toLocaleString('en-GB', {
    maximumFractionDigits: 2
  });
}

function fmtFull(n) {
  if (!isFinite(n)) return '';

  if (Math.abs(n) < 1e6) return '';

  return '(' + n.toLocaleString('en-GB', {
    maximumFractionDigits: 0
  }) + ')';
}

function fmt(n, currency = true) {
  if (!isFinite(n)) return String(n);

  if (!currency) {
    return fmtCompact(n);
  }

  if (Math.abs(n) >= 1e6) {
    return '£' + fmtCompact(n);
  }

  return new Intl.NumberFormat('en-GB', {
    style: 'currency',
    currency: 'GBP',
    minimumFractionDigits: 0,
    maximumFractionDigits: 2
  }).format(n);
}

function addStep() {
  stepCount++;

  document.getElementById('empty-hint')?.remove();

  const list = document.getElementById('steps-list');

  const row = document.createElement('div');

  row.className = 'step-row';
  row.dataset.op = '+';
  row.dataset.id = stepCount;

  row.innerHTML = `
    <span class="step-index">#${list.children.length + 1}</span>

    <select class="op-select"
      onchange="this.closest('.step-row').dataset.op=this.value">

      <option value="+">＋ add</option>
      <option value="-">－ subtract</option>
      <option value="*">× multiply</option>
      <option value="/">÷ divide</option>

    </select>

    <input type="text"
      class="val-input"
      placeholder="amount"
      value="1">

    <input type="text"
      class="name-input"
      placeholder="variable name">

    <button class="btn-remove"
      onclick="removeStep(this)"
      title="Remove">

      ✕
    </button>
  `;

  list.appendChild(row);

  reindex();

  row.querySelector('.val-input').focus();
}

function removeStep(btn) {
  btn.closest('.step-row').remove();

  reindex();

  if (!document.querySelectorAll('.step-row').length) {
    document.getElementById('steps-list').innerHTML = `
      <div class="empty-hint" id="empty-hint">
        No steps yet — add one below.
      </div>
    `;
  }
}

function reindex() {
  document.querySelectorAll('.step-row .step-index')
    .forEach((el, i) => {
      el.textContent = `#${i + 1}`;
    });
}

function calculate() {

  const startRaw = document.getElementById('start-value').value;

  const startVal = parseSuffix(startRaw);

  if (isNaN(startVal)) {
    alert('Invalid starting value.');
    return;
  }

  const rows = document.querySelectorAll('.step-row');

  const panel = document.getElementById('result-panel');

  const trace = document.getElementById('trace');

  trace.innerHTML = '';

  let running = startVal;

  const startLine = document.createElement('div');

  startLine.className = 'trace-line';

  startLine.innerHTML = `
    <span class="trace-op" style="color:var(--muted)">=</span>
    <span class="trace-desc">Starting value</span>
    <span class="trace-val">${fmt(startVal)}</span>
  `;

  trace.appendChild(startLine);

  for (const row of rows) {

    const op = row.dataset.op;

    const valRaw = row.querySelector('.val-input').value;

    const val = parseSuffix(valRaw);

    const name =
      row.querySelector('.name-input').value.trim() || 'value';

    if (isNaN(val)) {
      alert(`Invalid value in "${name}"`);
      return;
    }

    if (op === '+') {
      running += val;
    }

    else if (op === '-') {
      running -= val;
    }

    else if (op === '*') {
      running *= val;
    }

    else if (op === '/') {

      if (val === 0) {
        running = NaN;
      } else {
        running /= val;
      }
    }

    const meta = OP_LABELS[op];

    const isCurrency =
      op === '+' || op === '-';

    const line = document.createElement('div');

    line.className = 'trace-line';

    line.innerHTML = `
      <span class="trace-op ${meta.cls}">${op}</span>

      <span class="trace-desc">
        ${meta.word} <strong>${name}</strong>
      </span>

      <span class="trace-val">
        ${fmt(val, isCurrency)}
      </span>

      <span class="trace-running">
        →
        ${
          isFinite(running)
            ? fmt(running)
            : 'undefined'
        }
      </span>
    `;

    trace.appendChild(line);

    if (!isFinite(running)) {
      break;
    }
  }

  const finalNumber =
    document.getElementById('final-number');

  const finalRaw =
    document.getElementById('final-raw');

  if (isFinite(running)) {

    if (Math.abs(running) >= 1e6) {

      finalNumber.textContent =
        '£' + fmtCompact(running);

      finalRaw.textContent =
        fmtFull(running);

    } else {

      finalNumber.textContent =
        fmt(running);

      finalRaw.textContent = '';
    }

  } else {

    finalNumber.textContent =
      'undefined (÷0)';

    finalRaw.textContent = '';
  }

  panel.classList.add('visible');

  panel.scrollIntoView({
    behavior: 'smooth',
    block: 'nearest'
  });
}

function clearAll() {

  document.getElementById('steps-list').innerHTML = `
    <div class="empty-hint" id="empty-hint">
      No steps yet — add one below.
    </div>
  `;

  document.getElementById('result-panel')
    .classList.remove('visible');

  document.getElementById('start-value').value = '0';

  stepCount = 0;
}
</script>

</body>
</html>
